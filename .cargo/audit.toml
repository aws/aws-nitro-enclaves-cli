# cargo-audit configuration.
#
# The advisories below are all in transitive dependencies that cannot be
# upgraded without major version bumps to crates we do not control directly.
[advisories]
ignore = [
    # No fix available upstream.
    "RUSTSEC-2023-0071", # rsa

    # Transitive; no compatible fixed version.
    "RUSTSEC-2026-0045", # aws-lc-sys
    "RUSTSEC-2026-0046", # aws-lc-sys
    "RUSTSEC-2026-0047", # aws-lc-sys
    "RUSTSEC-2026-0048", # aws-lc-sys
    "RUSTSEC-2026-0049", # rustls-webpki
    "RUSTSEC-2026-0098", # rustls-webpki
    "RUSTSEC-2026-0099", # rustls-webpki
    "RUSTSEC-2026-0104", # rustls-webpki
    "RUSTSEC-2026-0119", # hickory-proto

    # Unmaintained crates pulled in transitively.
    "RUSTSEC-2024-0375", # atty
    "RUSTSEC-2021-0145", # atty
    "RUSTSEC-2021-0127", # serde_cbor
    "RUSTSEC-2024-0320", # yaml-rust
    "RUSTSEC-2025-0134", # rustls-pemfile
]
