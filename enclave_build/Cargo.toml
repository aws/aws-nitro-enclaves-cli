[package]
name = "aws-nitro-enclaves-enclave-build"
version = "1.0.0"
authors = ["The AWS Nitro Enclaves Team <aws-nitro-enclaves-devel@amazon.com>"]
edition = "2018"
rust-version = "1.94.1"
license = "Apache-2.0"
repository = "https://github.com/aws/aws-nitro-enclaves-cli"
description = "Builds an Enclave Image File (EIF) from a Docker image."
exclude = ["src/main.rs"]

[lib]
name = "enclave_build"
path = "src/lib.rs"

[dependencies]
bollard = { version = "0.19", features = ["aws-lc-rs"] }
clap = "~4.5"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.8"
serde_json = "1.0"
tempfile = "3.19.1"
tokio = { version = "1.43", features = ["rt-multi-thread"] }
base64 = "0.22"
log = "0.4"
url = "2.4"
sha2 = "0.10"
futures = "0.3.28"

aws-nitro-enclaves-image-format = "0.7"
tar = "0.4.40"
flate2 = "1.1.1"
